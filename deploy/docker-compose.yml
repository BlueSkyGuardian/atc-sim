# Internet deployment: the simulator behind Caddy (automatic HTTPS certificate from Let's Encrypt).
# 1. point a DNS name (e.g. atc.example.com) at this server, open ports 80 and 443
# 2. copy env.example to .env and fill it in (Google client, admin e-mail, domain)
# 3. docker compose up -d --build        (from this folder)
services:
  atcsim:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      ATC_DATA_DIR: /data
    volumes:
      - atc-data:/data                      # accounts database, recordings (.mp4), secret key
      - ../scenarios:/app/scenarios         # scenarios saved from the designer stay on the host
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ATC_DOMAIN: ${ATC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [atcsim]
volumes:
  atc-data:
  caddy-data:
