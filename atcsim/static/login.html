<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATC Simulator</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { width: min(400px, 92vw); }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; } .brand span { color: var(--accent); }
  .g { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px; background: #fff; color: #222; border: 0; font-weight: 600; margin-top: 18px; }
  .g:hover { background: #f1f1f1; }
  .sep { text-align: center; color: var(--dim); font-size: 12px; margin: 18px 0 8px; }
</style>
</head>
<body>
<div class="box card">
  <div class="brand">ATC <span>SIM</span></div>
  <div class="dim">En-route radar simulator · instructors, controllers and pseudo-pilots</div>
  <div id="google"></div>
  <div id="dev" style="display:none">
    <div class="sep">test sign-in (no Google client configured on this server)</div>
    <div class="row"><input id="email" class="grow" type="email" placeholder="name@gmail.com"><button id="devBtn" class="primary">Sign in</button></div>
  </div>
  <div class="msg bad" id="msg"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search), next = q.get('next') && q.get('next').startsWith('/') ? q.get('next') : '/';
if (q.get('error')) $('#msg').textContent = 'Sign-in failed: ' + q.get('error');
fetch('/auth/config').then(r => r.json()).then(c => {
  if (c.google) $('#google').innerHTML = `<button class="g" onclick="location.href='/auth/login?next=${encodeURIComponent(next)}'">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
    Sign in with Google</button>`;
  if (c.dev_login) $('#dev').style.display = '';
  if (!c.google && !c.dev_login) $('#msg').textContent = 'Sign-in is not configured on this server.';
});
async function dev() {
  const r = await fetch('/auth/dev', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#email').value }) });
  if (r.ok) location.href = next; else $('#msg').textContent = (await r.json()).detail || 'failed';
}
$('#devBtn').onclick = dev; $('#email').onkeydown = e => { if (e.key === 'Enter') dev(); };
</script>
</body>
</html>
