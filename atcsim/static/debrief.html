<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debrief</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/chart.umd.min.js"></script>
<style>
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin: 14px 0 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--depth); }
  .kpi .v { font: 700 24px var(--mono); color: var(--text); } .kpi .l { color: var(--dim); font-size: 12px; }
  .kpi.bad .v { color: #ff7a7a; } .kpi.good .v { color: #5fd3a3; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--depth); margin-bottom: 16px; }
  .chart canvas { width: 100% !important; height: 240px !important; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  .blk { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--depth); }
  .blk h2 { margin: 0 0 8px; font-size: 15px; } .blk h2 .dim { font-weight: 400; font-size: 12px; }
  .ev { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
  .ev:first-of-type { border-top: 0; }
  .ev .t { font-family: var(--mono); color: var(--dim); min-width: 62px; }
  .ev .tag { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; }
  .loss { border: 1px solid #5a2a2a; background: #2a151566; border-radius: 8px; padding: 9px 11px; margin-bottom: 10px; }
  .loss h3 { margin: 0 0 4px; font-size: 14px; color: #ff8a8a; } .loss .m { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .loss .ev { font-size: 12.5px; }
  .ok { color: #5fd3a3; } .bad { color: #ff7a7a; }
  .note { color: var(--dim); font-size: 12px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="crumb"><a href="/">Home</a> / <a href="/#exercises">Exercises</a> / Debrief</div>
  <h1 id="title">Debrief</h1>
  <div class="note" id="sub"></div>
  <div id="body"><p class="dim">Loading…</p></div>
</main>
<script src="/static/common.js"></script>
<script>
const EID = location.pathname.split('/').filter(Boolean).pop();
Chart.defaults.color = '#93a7ba'; Chart.defaults.borderColor = '#27405a'; Chart.defaults.font.family = 'Archivo, system-ui';
const T = s => 'T+' + fmtT(s);
const ev = (t, html, tag) => `<div class="ev"><span class="t">${t == null ? '' : T(t)}</span><span>${html}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
const none = s => `<div class="note">${s}</div>`;
const kpi = (v, l, cls = '') => `<div class="kpi ${cls}"><div class="v">${v ?? '–'}</div><div class="l">${l}</div></div>`;

(async () => {
  header('');
  let x;
  try { x = await api(`/api/exercises/${EID}/debrief`); }
  catch (e) { $('#body').innerHTML = `<p class="bad">${esc(e.message)}</p>`; return; }
  const d = x.debrief, rb = d.readback.counts || {};
  document.title = 'Debrief · ' + x.name;
  $('#title').textContent = 'Debrief · ' + x.name;
  const nm = m => [m.first_name, m.last_name].filter(Boolean).join(' ') || m.email;
  const ctl = x.solo ? x.instructor : (x.members || []).filter(m => m.seat === 'atc').map(nm).join(', ');
  $('#sub').innerHTML = `${esc(x.scenario)}${x.solo ? ' · solo' : ''} · ${fmtDate(x.created_at)} · ${T(d.sim_time_s)} of ${fmtT(d.duration_s)}` +
    (ctl ? ` · controller: ${esc(ctl)}` : '') + (x.solo ? '' : ` · instructor: ${esc(x.instructor)}`) +
    (x.live_now ? ' · <b class="ok">running: this is the debrief so far</b>' : '') +
    ` · <a href="/x/${EID}">${x.live_now ? 'Open the exercise' : 'Replay'}</a>`;
  const unans = d.requests.unanswered.filter(r => r.status === 'expired');
  let h = `<div class="kpis">
    ${kpi(d.losses.length, 'losses of separation', d.losses.length ? 'bad' : 'good')}
    ${kpi(d.infringements.length, 'area infringements', d.infringements.length ? 'bad' : '')}
    ${kpi(d.workload.peak, 'peak aircraft on frequency')}
    ${kpi(d.workload.mean, 'mean aircraft on frequency')}
    ${kpi(d.assume && d.assume.mean_delay_s != null ? Math.round(d.assume.mean_delay_s) + ' s' : '–', 'mean time to assume')}
    ${kpi(d.requests.mean_response_s != null ? Math.round(d.requests.mean_response_s) + ' s' : '–', 'mean request response')}
    ${kpi(unans.length + ' / ' + d.requests.total, 'requests left unanswered', unans.length ? 'bad' : '')}
    ${kpi(rb.errors ? `${rb.caught || 0} / ${rb.errors}` : '–', 'wrong read-backs caught', rb.missed ? 'bad' : rb.errors ? 'good' : '')}
  </div>
  <div class="chart"><h2 style="margin:0 0 2px;font-size:15px">Workload</h2><div class="note" style="margin-bottom:8px">Aircraft on the controller's frequency, minute by minute. Red: losses of separation; white: bookmarks.</div><canvas id="wl"></canvas></div>
  <div class="cols">`;
  // losses with what led to them
  h += `<div class="blk"><h2>Losses of separation <span class="dim">with the clearances given to the two aircraft in the 10 minutes before</span></h2>` +
    (d.losses.length ? d.losses.map(l => `<div class="loss"><h3>${l.aircraft.map(esc).join(' – ')} · ${T(l.start_s)}${l.end_s != null && !l.ongoing ? ' to ' + fmtT(l.end_s) : l.ongoing ? ' (still on at the end)' : ''}</h3>
        <div class="m">closest: ${l.min_horizontal_nm != null ? l.min_horizontal_nm + ' NM' : '–'} / ${l.min_vertical_ft != null ? l.min_vertical_ft + ' ft' : '–'}</div>` +
        (l.before.length ? l.before.map(c => ev(c.t, `<b>${esc(c.callsign)}</b> ${esc(c.text)}`, c.kind.replace('_', ' '))).join('') : none('No clearance to either aircraft in the 10 minutes before.')) + `</div>`).join('')
      : none('None. 👍')) + `</div>`;
  // bookmarks
  h += `<div class="blk"><h2>Bookmarks <span class="dim">moments marked during the run (⚑ Mark, K)</span></h2>` +
    (d.bookmarks.length ? d.bookmarks.map(b => ev(b.t, esc(b.note), esc(b.by || ''))).join('') : none('No bookmark. The instructor, the pseudo-pilots and the solo controller mark moments with ⚑ Mark (K) on the control bar.')) + `</div>`;
  // requests
  h += `<div class="blk"><h2>Requests not answered <span class="dim">${d.requests.total} pilot requests in all</span></h2>` +
    (d.requests.unanswered.length ? d.requests.unanswered.map(r => ev(r.t, esc(r.text), r.status === 'expired' ? '<span class="bad">expired</span>' : 'still pending')).join('') : none('All answered.')) + `</div>`;
  // read-backs
  h += `<div class="blk"><h2>Read-backs <span class="dim">wrong read-backs given on purpose (hearback)</span></h2>` +
    (d.readback.items.length ? d.readback.items.map(t => ev(t.t, `<b>${esc(t.callsign)}</b> read back ${esc(t.said)} for ${esc(t.cleared)}`, `<span class="${t.status === 'caught' ? 'ok' : 'bad'}">${t.status}</span>`)).join('')
      : none(rb.errors ? 'None decided yet.' : d.live.some(a => a.action === 'readback_rate') ? 'Read-back errors were on, but no wrong read-back came up.' : 'Read-back errors were off for this run (Live actions → Read-backs).')) + `</div>`;
  // infringements / weather
  const inf = d.infringements.map(i => ev(i.start_s ?? i.time_s ?? i.t, `<b>${esc(i.callsign || '')}</b> in ${esc(i.area || i.area_id || '')}${i.kind ? ' (' + esc(i.kind) + ')' : ''}${i.duration_s ? ' for ' + Math.round(i.duration_s) + ' s' : ''}`, 'infringement'));
  const wx = d.weather_penetrations.map(i => ev(i.start_s ?? i.time_s ?? i.t, `<b>${esc(i.callsign || '')}</b> in weather${i.max_dbz != null ? ' up to ' + i.max_dbz + ' dBZ' : ''}${i.duration_s ? ' for ' + Math.round(i.duration_s) + ' s' : ''}`, 'weather'));
  h += `<div class="blk"><h2>Areas and weather</h2>${inf.concat(wx).join('') || none('No infringement, no weather penetration.')}
    <div class="note" style="margin-top:6px">RVSM violations: ${d.rvsm_violations} · wrong-direction exits: ${d.wrong_direction_exits}</div></div>`;
  // live actions
  h += `<div class="blk"><h2>Live actions <span class="dim">traffic, emergencies, requests and areas changed during the run</span></h2>` +
    (d.live.length ? d.live.map(a => ev(a.t, esc(a.text), esc(a.by || ''))).join('') : none('None.')) + `</div>`;
  // clearances
  const ins = d.instructions || {}, cp = d.cpdlc || {};
  const cnt = Object.entries(ins).filter(([k, v]) => typeof v === 'number').map(([k, v]) => `${esc(k.replace(/_/g, ' '))}: <b>${v}</b>`);
  const cpc = Object.entries(cp).filter(([k, v]) => typeof v === 'number' && v).map(([k, v]) => `${esc(k.replace(/_/g, ' '))}: <b>${v}</b>`);
  h += `<div class="blk"><h2>Clearances</h2>${cnt.length ? `<div style="font-size:13px;line-height:1.7">${cnt.join(' · ')}</div>` : none('–')}
    ${cpc.length ? `<div class="note" style="margin-top:6px">CPDLC: ${cpc.join(' · ')}</div>` : ''}</div>`;
  h += `</div>`;
  $('#body').innerHTML = h;

  const pts = d.workload.per_minute;
  const near = t => { let b = 0; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(b - t) || !b) b = p[0]; const q = pts.find(p => p[0] === b); return q ? q[1] : 0; };
  new Chart($('#wl'), {
    data: { datasets: [
      { type: 'line', label: 'on frequency', data: pts.map(p => ({ x: p[0], y: p[1] })), borderColor: '#7fb8ff', backgroundColor: '#7fb8ff33', fill: true, tension: .25, pointRadius: 0 },
      { type: 'scatter', label: 'loss of separation', data: d.losses.map(l => ({ x: l.start_s / 60, y: near(l.start_s / 60), info: l.aircraft.join(' – ') })), backgroundColor: '#ff5a5a', pointRadius: 6, pointStyle: 'triangle' },
      { type: 'scatter', label: 'bookmark', data: d.bookmarks.map(b => ({ x: b.t / 60, y: near(b.t / 60), info: '⚑ ' + b.note })), backgroundColor: '#ffffff', pointRadius: 5, pointStyle: 'rectRot' },
    ] },
    options: { responsive: true, maintainAspectRatio: false, parsing: false,
      scales: { x: { type: 'linear', min: 0, title: { display: true, text: 'minutes' } }, y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: 'aircraft' } } },
      plugins: { legend: { labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => c.raw.info ? `T+${fmtT(c.raw.x * 60)} ${c.raw.info}` : `${c.raw.y} aircraft` } } } },
  });
})();
</script>
</body>
</html>
